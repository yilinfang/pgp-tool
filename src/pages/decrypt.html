<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Decrypt · PGP Tool</title>
    <link rel="stylesheet" href="../css/common.css" />
  </head>
  <body>
    <form id="app" autocomplete="off">
      <h1>Decrypt</h1>
      <p>
        Nothing is sent or stored. Closing the tab forgets all keys.
        <button type="button" id="clearAll">Clear all</button>
      </p>

      <section>
        <h2>Your private key</h2>
        <textarea
          id="myKey"
          rows="5"
          spellcheck="false"
          placeholder="-----BEGIN PGP PRIVATE KEY BLOCK-----"
        ></textarea>
        <input type="file" id="myKeyFile" accept=".asc,.gpg,.pgp,.key,.txt" />
        <label
          >Passphrase <input type="password" id="myPass" autocomplete="off"
        /></label>
        <pre class="info" id="myKeyInfo"></pre>
      </section>

      <section>
        <h2>Sender's public key (optional)</h2>
        <p>Load it to verify the signature of the message.</p>
        <textarea
          id="otherKeys"
          rows="5"
          spellcheck="false"
          placeholder="Paste one or more public keys"
        ></textarea>
        <input
          type="file"
          id="otherKeysFile"
          accept=".asc,.gpg,.pgp,.key,.txt"
          multiple
        />
        <pre class="info" id="otherKeysInfo"></pre>
      </section>

      <section>
        <h2>Message</h2>
        <textarea
          id="decIn"
          rows="6"
          spellcheck="false"
          placeholder="-----BEGIN PGP MESSAGE-----"
        ></textarea>
        <button type="button" id="decBtn">Decrypt</button>
        <pre class="info" id="decStatus"></pre>
        <textarea id="decOut" rows="6" spellcheck="false" readonly></textarea>
      </section>
    </form>
    <script type="module" src="../js/decrypt.js"></script>
  </body>
</html>
